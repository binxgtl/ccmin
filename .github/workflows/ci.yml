name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      # End-to-end: the demo must find and shrink a real bug.
      # Exit code 1 means "counterexample found", which is success here.
      - name: demo
        shell: bash
        run: |
          cargo run --release -- --demo --no-save && code=0 || code=$?
          test "$code" -eq 1
