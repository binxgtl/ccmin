name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  msrv:
    name: Rust 1.74 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74
      - run: cargo check --locked --all-targets

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      # End-to-end: the demo must find and shrink a real bug.
      # Exit code 1 means "counterexample found", which is success here.
      - name: demo
        shell: bash
        run: |
          cargo run --release -- --demo --no-save && code=0 || code=$?
          test "$code" -eq 1
      - name: tree reducer end-to-end
        shell: bash
        run: |
          cargo run --release -- \
            --shape tree \
            --sol testdata/tree/sol.cpp \
            --brute testdata/tree/brute.cpp \
            --gen testdata/tree/gen.cpp \
            --iters 1 --no-save --no-color && code=0 || code=$?
          test "$code" -eq 1
      - name: graph reducer end-to-end
        shell: bash
        run: |
          cargo run --release -- \
            --shape graph \
            --sol testdata/graph/sol.cpp \
            --brute testdata/graph/brute.cpp \
            --gen testdata/graph/gen.cpp \
            --iters 1 --no-save --no-color && code=0 || code=$?
          test "$code" -eq 1
      - name: custom checker end-to-end
        shell: bash
        run: |
          cargo run --release -- \
            --shape array \
            --sol testdata/checker/sol.cpp \
            --brute testdata/checker/brute.cpp \
            --gen testdata/checker/gen.cpp \
            --checker python \
            --checker-arg testdata/checker/checker.py \
            --iters 1 --no-save --no-color && code=0 || code=$?
          test "$code" -eq 1
      # The declared constraints must change the answer, not merely be accepted.
      # Without the schema the reducer reaches a value of 0, which the statement
      # forbids; with it, the reduced case sits on the real threshold.
      - name: schema constraints end-to-end
        shell: bash
        run: |
          set -x
          cargo run --release -- \
            --sol testdata/schema/sol.cpp \
            --brute testdata/schema/brute.cpp \
            --gen testdata/schema/gen.cpp \
            --no-save --no-color > unconstrained.txt && code=0 || code=$?
          test "$code" -eq 1

          cargo run --release -- \
            --sol testdata/schema/sol.cpp \
            --brute testdata/schema/brute.cpp \
            --gen testdata/schema/gen.cpp \
            --schema testdata/schema/input.schema \
            --no-save --no-color > constrained.txt && code=0 || code=$?
          test "$code" -eq 1

          # Unconstrained reduction leaves the legal range; constrained does not.
          grep -qx '0' unconstrained.txt
          grep -qx '500000' constrained.txt
          ! grep -qx '0' constrained.txt
      # A typo in a schema must not cost a compile and a full stress run first.
      - name: schema errors are reported before compiling
        shell: bash
        run: |
          printf 'int N in 1..10\nwidget W\n' > bad.schema
          cargo run --release -- --schema bad.schema --no-color > schema-error.txt 2>&1 && code=0 || code=$?
          cat schema-error.txt
          test "$code" -eq 2
          grep -q 'unknown declaration' schema-error.txt
          ! grep -q 'compiling with' schema-error.txt
